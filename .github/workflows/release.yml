name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-native:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross toolchain (gnu)
        if: contains(matrix.target, 'aarch64-unknown-linux-gnu')
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross toolchain (musl)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install
        working-directory: packages/tracekit
        run: npm ci
      - name: Build native addon
        working-directory: packages/tracekit
        run: npx napi build --platform --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: packages/tracekit/*.node
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build-native
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/tracekit/package-lock.json
      - name: Install
        working-directory: packages/tracekit
        run: npm ci
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/tracekit
          pattern: native-*
          merge-multiple: true
      - name: Build TypeScript
        working-directory: packages/tracekit
        run: npm run build:ts
      - name: Assemble platform packages
        working-directory: packages/tracekit
        run: npx napi create-npm-dirs && npx napi artifacts
      - name: Publish platform packages and main package
        working-directory: packages/tracekit
        run: npx napi prepublish -t npm --skip-gh-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - name: Publish main package with provenance
        working-directory: packages/tracekit
        run: npm publish --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
